services:
  postgres:
    image: postgres:17-alpine
    container_name: shopsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./services/user-service
    container_name: shopsphere-user-service
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: my-secret
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopsphere
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: ./services/product-service
    container_name: shopsphere-product-service
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopsphere
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: