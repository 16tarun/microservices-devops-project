apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: shopsphere

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service

          image: shopsphere-user:v1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: USER_SERVICE_PORT

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: NODE_ENV

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secret
                  key: JWT_SECRET

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secret
                  key: DATABASE_URL      

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"