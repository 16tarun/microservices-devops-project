apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service
  namespace: shopsphere

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service

          image: shopsphere-product:v1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5001

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: PRODUCT_SERVICE_PORT

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shopsphere-config
                  key: NODE_ENV

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secret
                  key: DATABASE_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"